name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # The offline-export tests (tests/offline.test.js) run first; the site is only
  # deployed when they pass, so a failure leaves the previous release live.
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Offline tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tests update from earlier releases in git history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and its browsers
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: npm test
        run: node tests/offline.test.js
        env:
          CI: true
          POOL: 2                 # two scenarios per engine at once on the runner's two cores

  build_and_deploy:
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # App content is at the repo root — no build step needed
          app_location: "/"
          # Managed function for the live backup endpoint
          api_location: "api"
          # No build output folder — the files at app_location ARE the output
          output_location: ""
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
